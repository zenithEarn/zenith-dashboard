name = "zenith-backend"
main = "worker.js"
compatibility_date = "2024-01-01"

# Persistent Cloudflare KV namespace binding for user tasks, balances, and state
[[kv_namespaces]]
binding = "ZENIVORA_KV"
id = "zenivora-kv"
preview_id = "zenivora-kv"

# NOTE: Do NOT put your bot token here in plain text.
# Store it as a Cloudflare Worker secret:
# wrangler secret put TELEGRAM_BOT_TOKEN

